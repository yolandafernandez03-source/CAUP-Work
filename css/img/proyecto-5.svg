<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#p5Grad)" />

  <!-- Wireframe / UI Mockup Windows -->
  <g transform="translate(160, 70)">
    <!-- Browser Window -->
    <rect width="480" height="280" rx="12" fill="#ffffff" />
    <!-- Browser header -->
    <rect width="480" height="36" rx="12" fill="#f1f5f9" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <rect x="80" y="9" width="320" height="18" rx="6" fill="#e2e8f0" />

    <!-- UI Elements -->
    <rect x="30" y="60" width="180" height="18" rx="4" fill="#6366f1" />
    <rect x="30" y="90" width="240" height="10" rx="3" fill="#94a3b8" />
    <rect x="30" y="108" width="200" height="10" rx="3" fill="#cbd5e1" />
    <rect x="30" y="135" width="90" height="28" rx="6" fill="#4f46e5" />

    <!-- Right Side Card -->
    <rect x="300" y="60" width="150" height="180" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
    <rect x="315" y="75" width="120" height="80" rx="6" fill="#e0e7ff" />
    <rect x="315" y="168" width="80" height="10" rx="3" fill="#64748b" />
    <rect x="315" y="185" width="100" height="8" rx="2" fill="#cbd5e1" />
  </g>

  <!-- Bottom Title Label -->
  <rect x="40" y="400" width="720" height="64" rx="12" fill="#0f172a" fill-opacity="0.85" />
  <text x="65" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Proyecto 5: Diseño UX/UI & Prototipo Web</text>
  <text x="735" y="438" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">img/proyecto-5.svg</text>
</svg>
