<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#p4Grad)" />

  <!-- Audio Waveform Visualization -->
  <g transform="translate(150, 160)" fill="#f43f5e">
    <rect x="0" y="50" width="10" height="40" rx="5" fill="#fda4af" />
    <rect x="25" y="30" width="10" height="80" rx="5" fill="#f43f5e" />
    <rect x="50" y="10" width="10" height="120" rx="5" fill="#fb7185" />
    <rect x="75" y="40" width="10" height="60" rx="5" fill="#fda4af" />
    <rect x="100" y="0" width="10" height="140" rx="5" fill="#ffffff" />
    <rect x="125" y="25" width="10" height="90" rx="5" fill="#f43f5e" />
    <rect x="150" y="50" width="10" height="40" rx="5" fill="#fda4af" />
    
    <!-- Center Microphone Icon -->
    <g transform="translate(200, 10)">
      <rect width="100" height="120" rx="20" fill="#1e1b4b" stroke="#fda4af" stroke-width="2" />
      <text x="50" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="40" fill="#ffffff">🎙️</text>
    </g>

    <rect x="340" y="40" width="10" height="60" rx="5" fill="#fda4af" />
    <rect x="365" y="10" width="10" height="120" rx="5" fill="#fb7185" />
    <rect x="390" y="0" width="10" height="140" rx="5" fill="#ffffff" />
    <rect x="415" y="30" width="10" height="80" rx="5" fill="#f43f5e" />
    <rect x="440" y="50" width="10" height="40" rx="5" fill="#fda4af" />
    <rect x="465" y="60" width="10" height="20" rx="5" fill="#fda4af" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(250, 310)">
    <rect width="300" height="44" rx="22" fill="#0f172a" fill-opacity="0.8" stroke="#fb7185" stroke-width="1.5" />
    <text x="150" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">TEMPORADA 1 • 8 EPISODIOS</text>
  </g>

  <!-- Bottom Title Label -->
  <rect x="40" y="400" width="720" height="64" rx="12" fill="#0f172a" fill-opacity="0.85" />
  <text x="65" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Proyecto 4: Podcast & Producción Sonora "Onda Digital"</text>
  <text x="735" y="438" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">img/proyecto-4.svg</text>
</svg>
