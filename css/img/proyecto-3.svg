<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#p3Grad)" />

  <!-- Color Palette Swatches -->
  <g transform="translate(140, 100)">
    <rect x="0" y="0" width="90" height="150" rx="12" fill="#10b981" />
    <rect x="110" y="0" width="90" height="150" rx="12" fill="#34d399" />
    <rect x="220" y="0" width="90" height="150" rx="12" fill="#a7f3d0" />
    <rect x="330" y="0" width="90" height="150" rx="12" fill="#0f172a" />
    <rect x="440" y="0" width="90" height="150" rx="12" fill="#f8fafc" />
  </g>

  <!-- Brand Typography Showcase -->
  <g transform="translate(180, 275)">
    <rect width="440" height="85" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#10b981" stroke-width="1.5" />
    <text x="220" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="4">AURORA BRAND</text>
    <text x="220" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#a7f3d0" letter-spacing="3">SISTEMA VISUAL & MANUAL CORPORATIVO</text>
  </g>

  <!-- Bottom Title Label -->
  <rect x="40" y="400" width="720" height="64" rx="12" fill="#0f172a" fill-opacity="0.85" />
  <text x="65" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Proyecto 3: Identidad Visual y Rediseño de Marca</text>
  <text x="735" y="438" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">img/proyecto-3.svg</text>
</svg>
