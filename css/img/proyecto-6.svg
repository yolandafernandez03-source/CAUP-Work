<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p6Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#p6Grad)" />

  <!-- Data Journalism Chart Visualization -->
  <g transform="translate(180, 100)">
    <!-- Chart Box -->
    <rect width="440" height="230" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.5" />
    <!-- Bar charts -->
    <rect x="50" y="140" width="30" height="60" rx="4" fill="#818cf8" />
    <rect x="110" y="90" width="30" height="110" rx="4" fill="#6366f1" />
    <rect x="170" y="50" width="30" height="150" rx="4" fill="#4f46e5" />
    <rect x="230" y="110" width="30" height="90" rx="4" fill="#a5b4fc" />
    <rect x="290" y="70" width="30" height="130" rx="4" fill="#06b6d4" />
    <rect x="350" y="30" width="30" height="170" rx="4" fill="#10b981" />

    <!-- Trend line -->
    <polyline points="65,130 125,85 185,45 245,105 305,65 365,25" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <circle cx="365" cy="25" r="5" fill="#f59e0b" />
  </g>

  <!-- Bottom Title Label -->
  <rect x="40" y="400" width="720" height="64" rx="12" fill="#0f172a" fill-opacity="0.85" />
  <text x="65" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Proyecto 6: Reportaje Multimedia & Periodismo de Datos</text>
  <text x="735" y="438" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">img/proyecto-6.svg</text>
</svg>
