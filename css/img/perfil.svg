<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.85" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)" />

  <!-- Geometric accent circles -->
  <circle cx="100" cy="120" r="140" fill="#ffffff" fill-opacity="0.06" />
  <circle cx="520" cy="480" r="160" fill="#ffffff" fill-opacity="0.05" />

  <!-- Avatar graphic -->
  <g filter="url(#shadow)">
    <!-- Head -->
    <circle cx="300" cy="220" r="85" fill="url(#avatarGrad)" />
    <!-- Body silhouette -->
    <path d="M 170,440 C 170,335 220,330 300,330 C 380,330 430,335 430,440 Z" fill="url(#avatarGrad)" />
  </g>

  <!-- Communication badge icons -->
  <g transform="translate(140, 160)">
    <rect width="64" height="64" rx="16" fill="#ffffff" filter="url(#shadow)" />
    <path d="M 22,24 L 42,24 M 22,32 L 36,32 M 22,40 L 30,40" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" />
  </g>

  <g transform="translate(400, 260)">
    <rect width="64" height="64" rx="16" fill="#ffffff" filter="url(#shadow)" />
    <polygon points="26,20 44,32 26,44" fill="#06b6d4" />
  </g>

  <!-- Overlay text info -->
  <rect x="75" y="475" width="450" height="75" rx="16" fill="#0f172a" fill-opacity="0.75" />
  <text x="300" y="508" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">FOTO DE PERFIL (DEMO)</text>
  <text x="300" y="534" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">Sustituir por: img/perfil.jpg (600x600 px)</text>
</svg>
