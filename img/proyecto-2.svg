<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <linearGradient id="socialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#p2Grad)" />

  <!-- Mobile Mockup -->
  <g transform="translate(310, 60)">
    <rect width="180" height="310" rx="28" fill="#1e293b" stroke="#475569" stroke-width="4" />
    <!-- Screen -->
    <rect x="8" y="14" width="164" height="282" rx="20" fill="#020617" />
    <!-- Notch -->
    <rect x="60" y="20" width="60" height="12" rx="6" fill="#1e293b" />
    <!-- Content Simulation -->
    <circle cx="90" cy="90" r="32" fill="url(#socialGrad)" />
    <path d="M 82,78 L 102,90 L 82,102 Z" fill="#ffffff" />
    <!-- Metrics bars -->
    <rect x="25" y="140" width="130" height="12" rx="4" fill="#334155" />
    <rect x="25" y="160" width="90" height="10" rx="4" fill="#64748b" />
    <rect x="25" y="190" width="130" height="30" rx="8" fill="url(#socialGrad)" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1" />
    <text x="90" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f43f5e">+320% ALCANCE</text>
  </g>

  <!-- Floating Stats Cards -->
  <g transform="translate(110, 140)">
    <rect width="160" height="80" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">ENGAGEMENT RATE</text>
    <text x="20" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" fill="#38bdf8">8.4%</text>
  </g>

  <g transform="translate(530, 180)">
    <rect width="160" height="80" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">INTERACCIONES</text>
    <text x="20" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" fill="#f43f5e">45.2K</text>
  </g>

  <!-- Bottom Title Label -->
  <rect x="40" y="400" width="720" height="64" rx="12" fill="#0f172a" fill-opacity="0.85" />
  <text x="65" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Proyecto 2: Plan Social Media & Contenido Viral</text>
  <text x="735" y="438" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">img/proyecto-2.svg</text>
</svg>
