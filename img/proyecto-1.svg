<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#p1Grad)" />

  <!-- Transmedia Network Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5">
    <line x1="100" y1="100" x2="250" y2="220" />
    <line x1="250" y1="220" x2="400" y2="140" />
    <line x1="400" y1="140" x2="550" y2="240" />
    <line x1="550" y1="240" x2="700" y2="160" />
    <line x1="250" y1="220" x2="320" y2="340" />
    <line x1="400" y1="140" x2="480" y2="320" />
    <line x1="550" y1="240" x2="480" y2="320" />
  </g>

  <!-- Connecting Nodes -->
  <circle cx="100" cy="100" r="16" fill="#818cf8" />
  <circle cx="250" cy="220" r="28" fill="#4f46e5" stroke="#a5b4fc" stroke-width="4" />
  <circle cx="400" cy="140" r="24" fill="#06b6d4" stroke="#67e8f9" stroke-width="4" />
  <circle cx="550" cy="240" r="32" fill="#ec4899" stroke="#f472b6" stroke-width="4" />
  <circle cx="700" cy="160" r="18" fill="#10b981" />
  <circle cx="320" cy="340" r="20" fill="#f59e0b" />
  <circle cx="480" cy="320" r="22" fill="#8b5cf6" />

  <!-- Main Illustration: Transmedia Screen / Book Symbol -->
  <rect x="260" y="160" width="280" height="150" rx="16" fill="#0f172a" fill-opacity="0.7" stroke="#818cf8" stroke-width="2" />
  <text x="400" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" fill="#ffffff">🎬 📖 📱</text>
  <text x="400" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#a5b4fc" letter-spacing="2">STORYTELLING TRANSMEDIA</text>

  <!-- Bottom Title Label -->
  <rect x="40" y="400" width="720" height="64" rx="12" fill="#0f172a" fill-opacity="0.85" />
  <text x="65" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Proyecto 1: Campaña Transmedia "EcoVoz"</text>
  <text x="735" y="438" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">img/proyecto-1.svg</text>
</svg>
